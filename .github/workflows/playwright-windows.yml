name: Playwright Tests (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: python -m playwright install chromium

      - name: Run Playwright Tests
        run: python -m pytest

      - name: Generate Allure Report
        if: always()
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "tools/allure-2.46.1.zip" -DestinationPath "$env:RUNNER_TEMP/allure" -Force
          $allure = "$env:RUNNER_TEMP/allure/allure-2.46.1/bin/allure.bat"
          & $allure generate allure-results --clean -o allure-report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Test Artifacts (Allure Results & Traces)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-and-artifacts
          path: |
            allure-results/
            allure-report/
            test-results/
       
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report     